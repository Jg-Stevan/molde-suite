name: Desplegar Molde Studio a GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/molde-studio/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Instalar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Instalar dependencias
        working-directory: apps/molde-studio
        run: bun install --frozen-lockfile
      - name: Compilar version estatica (sin backend, datos en IndexedDB)
        working-directory: apps/molde-studio
        run: |
          rm -rf src/app/api
          NEXT_PUBLIC_STATIC=1 NEXT_PUBLIC_BASE_PATH=/molde-suite bun run build:static
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/molde-studio/out
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
