name: Desplegar Molde Suite a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Instalar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Instalar dependencias (workspace raíz)
        run: bun install --frozen-lockfile
      - name: Generar cliente Prisma — apps/molde-studio
        working-directory: apps/molde-studio
        run: bun run db:generate
      - name: Compilar Molde Studio (/molde-suite/studio/)
        working-directory: apps/molde-studio
        run: |
          rm -rf src/app/api
          NEXT_PUBLIC_STATIC=1 NEXT_PUBLIC_BASE_PATH=/molde-suite/studio bun run build:static
      - name: Compilar Tamiz (/molde-suite/tamiz/)
        working-directory: apps/tamiz
        run: BUILD_STATIC=1 NEXT_PUBLIC_BASE_PATH=/molde-suite/tamiz bun run build
      - name: Armar sitio (hub + dos apps)
        run: |
          mkdir -p _site/studio _site/tamiz
          cp -R apps/molde-studio/out/. _site/studio/
          cp -R apps/tamiz/out/. _site/tamiz/
          cp index.html _site/index.html
          touch _site/.nojekyll
      - name: Configurar Pages
        uses: actions/configure-pages@v6
      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
